<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>知识库问答</title>
</head>
<body>
    <input placeholder="请输入问题" id="question">
    <button id="askBtn">提问</button>
    <div id="answer">答案放这</div>
    <script>
        var inputBox=document.getElementById("question");
        var btn=document.getElementById("askBtn");
        var answerBox=document.getElementById("answer");
        btn.onclick=function () {
            var q = inputBox.value;
            
            fetch("/ask?question=" + q)
            .then(function(r){
                return r.json();
            })
            .then(function(data){
                answerBox.innerText = data.answer;
            });
        };
    </script>
</body>
</html>
